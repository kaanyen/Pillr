# Upload release APK (and optionally iOS IPA) to Firebase App Distribution.
# Secrets: FIREBASE_TOKEN (from `firebase login:ci`), FIREBASE_ANDROID_APP_ID (Firebase Console → Project settings → Your apps → App ID).
# Optional iOS: FIREBASE_IOS_APP_ID + Apple signing — omit job if not configured.

name: App Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  distribute-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep this in step with ci.yml. 3.27.0 ships Dart 3.6.0, below the
      # ^3.11.4 the pubspec asks for, so every tag died at `flutter pub get`
      # and no APK ever reached a tester.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
      - run: flutter pub get
      # The app has development, staging and production versions; testers get
      # production, which talks to the live church data like the website.
      - run: flutter build apk --release --flavor production
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Distribute to testers
        env:
          # A service account key with the "Firebase App Distribution Admin"
          # role, saved as this repository's FIREBASE_DISTRIBUTION_KEY secret.
          FIREBASE_DISTRIBUTION_KEY: ${{ secrets.FIREBASE_DISTRIBUTION_KEY }}
          # Not a secret: the Android app's id from google-services.json.
          FIREBASE_ANDROID_APP_ID: 1:1077479720410:android:bee47285633ea5150a6ce3
        run: |
          if [ -z "$FIREBASE_DISTRIBUTION_KEY" ]; then
            echo "::error::Add the FIREBASE_DISTRIBUTION_KEY secret to the repository first."
            exit 1
          fi
          echo "$FIREBASE_DISTRIBUTION_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-production-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "testers" \
            --release-notes "Build from ${GITHUB_REF_NAME:-manual run}"

  # Optional iOS: copy this job to a new workflow or uncomment when `FIREBASE_IOS_APP_ID`,
  # `FIREBASE_TOKEN`, and Apple signing are configured — see docs/RELEASE.md.
