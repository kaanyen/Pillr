<!DOCTYPE html><html><head>
  <!--
    thepillr.com is the only address the app is used at. Firebase always serves
    the project's default domains as well, and they cannot be switched off, so
    send anyone who lands on one to the same path on thepillr.com — before the
    app loads. /__/ is left alone: Firebase Auth serves its sign-in and
    email-action pages there on the authDomain (thepillr2.firebaseapp.com).
  -->
  <script>
    (function () {
      var h = location.hostname;
      if ((h === "thepillr2.web.app" || h === "thepillr2.firebaseapp.com") &&
          location.pathname.indexOf("/__/") !== 0) {
        location.replace("https://thepillr.com" + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Church partnership management — The Pillr">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Pillr">

  <!-- Favicon (main mark — app icon is install/launcher only) -->
  <link rel="icon" type="image/svg+xml" href="icons/pillr_logo_main.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Home-screen install icon stays the square app mark -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>The Pillr</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  
  
  <style id="splash-screen-style">
    /* The splash from the canvas board "Splash and loader": the mark builds
       once on the app's page colour; still loading after 1.1 s, it loops as
       the loader. Flutter takes over with the same mark (PillrBootSplash). */
    @font-face { font-family: Manrope; font-weight: 800; src: url("assets/assets/fonts/Manrope-ExtraBold.ttf") format("truetype"); font-display: swap; }
    html { height: 100% }
    body { margin: 0; min-height: 100%; background-color: #FEFEFD; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #FEFEFD; font-family: Manrope, ui-sans-serif, system-ui, sans-serif; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
    #splash .word { font-size: 44px; font-weight: 800; letter-spacing: -0.055em; color: #13426F; line-height: 1; animation: sp-fade 200ms var(--ease-out) 560ms both; }
    #splash .hint { position: absolute; bottom: 15%; font-size: 13px; font-weight: 500; color: #616C8A; opacity: 0; animation: sp-show 200ms ease 1100ms forwards; }
    #splash svg rect { transform-box: fill-box; transform-origin: 50% 100%; }
    #splash .sq { animation: sp-sq 200ms var(--ease-out) both; }
    #splash .c1 { animation: sp-rise 220ms var(--ease-out) 120ms both, sp-b1 1400ms var(--ease-out) 1100ms infinite; }
    #splash .c2 { animation: sp-rise 220ms var(--ease-out) 190ms both, sp-b2 1400ms var(--ease-out) 1100ms infinite; }
    #splash .c3 { animation: sp-rise 220ms var(--ease-out) 260ms both, sp-b3 1400ms var(--ease-out) 1100ms infinite; }
    #splash .c4 { animation: sp-lay 260ms var(--ease-out) 330ms both, sp-b4 1400ms var(--ease-out) 1100ms infinite; }
    @keyframes sp-sq { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: none } }
    @keyframes sp-rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes sp-lay { from { opacity: 0; transform: translateY(-10px) } to { opacity: 1; transform: none } }
    @keyframes sp-fade { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
    @keyframes sp-show { to { opacity: 1 } }
    @keyframes sp-b1 { 0% { opacity: 0; transform: translateY(5px) } 12%, 78% { opacity: 1; transform: none } 92%, 100% { opacity: 0 } }
    @keyframes sp-b2 { 0%, 12% { opacity: 0; transform: translateY(5px) } 24%, 78% { opacity: 1; transform: none } 92%, 100% { opacity: 0 } }
    @keyframes sp-b3 { 0%, 24% { opacity: 0; transform: translateY(5px) } 36%, 78% { opacity: 1; transform: none } 92%, 100% { opacity: 0 } }
    @keyframes sp-b4 { 0%, 36% { opacity: 0; transform: translateY(-8px) } 52%, 78% { opacity: 1; transform: none } 92%, 100% { opacity: 0 } }
    @keyframes sp-calm { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
    @media (prefers-reduced-motion: reduce) {
      #splash .sq, #splash .c1, #splash .c2, #splash .c3, #splash .c4, #splash .word { animation: sp-show 200ms ease forwards; opacity: 0; transform: none; }
      #splash svg { animation: sp-calm 1600ms ease-in-out 1100ms infinite; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash" role="img" aria-label="Pillr is loading">
    <svg width="120" height="120" viewBox="0 0 48 48" aria-hidden="true"><rect class="sq" width="48" height="48" rx="12" fill="#13426F"></rect><rect class="c4" x="11" y="8" width="26" height="5" rx="2.5" fill="#2E96FF"></rect><rect class="c3" x="16" y="16" width="16" height="7" rx="3.5" fill="#FFFFFF"></rect><rect class="c2" x="16" y="26" width="16" height="7" rx="3.5" fill="#FFFFFF"></rect><rect class="c1" x="11" y="36" width="26" height="5" rx="2.5" fill="#FFFFFF"></rect></svg>
    <span class="word">pillr</span>
    <span class="hint">Still loading your church…</span>
  </div>
  
  
  
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
